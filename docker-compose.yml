services:
  greenear:
    build:
      context: .
    image: greenear:v0.0.5
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      MAX_UPLOAD_MB: "500"
      SESSION_TTL_HOURS: "1"
    volumes:
      - greenear-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  greenear-data: